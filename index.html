<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Douze semaines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
:root{
  --bg:#F4F1FF;--ink:#1D1A3B;--mute:#5F5C86;--line:#D9D3F2;--pink:#D61F7F;--on-pink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15132B;--ink:#F0ECFF;--mute:#A9A5D0;--line:#2E2A55;--pink:#FF5CA8;--on-pink:#15132B;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#15132B;--ink:#F0ECFF;--mute:#A9A5D0;--line:#2E2A55;--pink:#FF5CA8;--on-pink:#15132B;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:1.125rem;line-height:1.6}
main{max-width:40rem;margin:0 auto;padding:3.5rem 1.25rem 4rem}
h1{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:clamp(3.2rem,15vw,6.2rem);line-height:.92;letter-spacing:-.035em;margin:0 0 1.5rem}
.lead{max-width:30rem;margin:0 0 1rem}
.status{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:500;font-size:1rem;margin:0 0 2.5rem;color:var(--mute)}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
summary,.row{display:grid;grid-template-columns:2.2rem 1fr auto;gap:.75rem;align-items:baseline;padding:1rem .25rem;font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.n{font-weight:500;color:var(--mute)}
.t{font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.d{font-weight:500;font-size:.95rem;color:var(--mute);text-align:right}
.locked{color:var(--mute)}
.locked .t{font-weight:500;font-size:1rem}
.now summary{background:var(--pink);color:var(--on-pink);border-radius:.4rem;padding-left:.6rem;padding-right:.6rem}
.now .n,.now .d{color:inherit}
details[open]>summary .d::after{content:" ·  ouvert"}
.body{padding:.25rem .25rem 1.5rem 3.2rem}
.body p{margin:0 0 .9rem;max-width:34rem}
.todo{font-style:italic;color:var(--mute)}
a{color:var(--pink);text-underline-offset:.2em}
.end{margin-top:3rem;color:var(--mute);font-size:1rem}
.track{margin:0 0 2.2rem;max-width:34rem}
.track h3{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:500;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:0 0 .3rem}
.body .tt{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:1.2rem;margin:0 0 .4rem}
.hm{color:var(--mute);font-size:1rem}
.yours{margin-top:.8rem;padding:.9rem .9rem .4rem;border:1px solid var(--line);border-radius:.5rem}
.yours label{display:block;font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:500;font-size:.9rem;margin:0 0 .4rem}
input,textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:.35rem;padding:.55rem .65rem;margin:0 0 .6rem}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pink);outline-offset:1px}
button.copy{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:1rem;background:var(--pink);color:var(--on-pink);border:0;border-radius:.4rem;padding:.7rem 1.1rem;cursor:pointer}
.copied{margin:.6rem 0 0;color:var(--mute);font-size:1rem}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.9rem 0 0;align-items:start}
.gallery img{width:100%;height:auto;display:block;border-radius:.4rem}
.gallery img.wide{grid-column:1/-1}
@media (max-width:30rem){.body{padding-left:.25rem}}
</style>
</head>
<body>
<main>
  <h1>Douze semaines</h1>
  <p class="lead">Je pars, mais je ne veux pas disparaître. Chaque dimanche, une nouvelle page s’ouvre ici : une histoire, une chanson, une question. Douze rendez-vous pour mieux me connaître.</p>
  <p class="status" id="status"></p>
  <ol id="list"></ol>
  <p class="end">Fait avec soin, depuis l’autre bout du monde.</p>
</main>
<script>
// ====== À MODIFIER ======
var START = new Date(2026, 10, 1); // 1er novembre 2026 (mois 0-11 : 10 = novembre)
var WEEKS = [
  {t:"10 musiques qui comptent pour moi", b:"<div id='w1'></div>"},
  {t:"Un morceau, son histoire", b:"<p>Pourquoi je l’ai écrit, ce qu’il raconte, ce qui s’est passé ce jour-là.</p><p class='todo'>À remplacer : le titre, le contexte et un lien pour l’écouter.</p>"},
  {t:"Le quiz : devine-moi", b:"<p>Cinq questions sur moi. Réponds sans tricher, je te dis ce qu’il en est la semaine prochaine.</p><p class='todo'>À remplacer par tes 5 questions (par exemple : mon plus gros défaut, mon plat préféré…).</p>"},
  {t:"Ce que j’écoute en boucle", b:"<p>Le titre que j’ai le plus écouté ces derniers temps : <a href='https://open.spotify.com/track/3FZoov0ORtnr8TznSNI1y2' target='_blank' rel='noopener'>« brand new chanel$ » de Slayyyter</a>.</p><p class='todo'>À compléter avec les autres titres de ta liste.</p>"},
  {t:"Une photo, une histoire", b:"<p class='todo'>À remplacer par une photo d’enfance (ou d’ado) et l’histoire derrière.</p>"},
  {t:"Mon plus gros défaut", b:"<p>Autant te le dire tout de suite.</p><p class='todo'>À remplacer par ta version honnête.</p>"},
  {t:"Ma question pour toi", b:"<p>Tu as lu six semaines de moi. À ton tour.</p><p class='todo'>À remplacer par une question, et dis-lui où te répondre.</p>"},
  {t:"Ma journée parfaite", b:"<p class='todo'>À remplacer : heure par heure, ou en vrac.</p>"},
  {t:"Ce que le voyage m’apprend", b:"<p class='todo'>À remplacer : une photo, un lieu, une chose que tu n’avais pas prévue.</p>"},
  {t:"Un morceau en cours de route", b:"<p class='todo'>À remplacer par un extrait audio d’un titre en chantier.</p>"},
  {t:"Ce que j’ai hâte de faire avec toi", b:"<p class='todo'>À remplacer par ta liste, même courte.</p>"},
  {t:"Bientôt", b:"<p>Le dernier dimanche. La suite, on l’écrit ensemble.</p><p class='todo'>À remplacer par ton mot de fin.</p>"}
];
// ========================

var DAY = 86400000, WEEK = 7 * DAY;
var fmt = new Intl.DateTimeFormat("fr-BE", {day:"numeric", month:"long"});
var now = new Date();
var preview = (location.hash === "#apercu");
var current = Math.floor((now - START) / WEEK) + 1; // 1..12 = semaine en cours
var opened = preview ? WEEKS.length : Math.max(0, Math.min(WEEKS.length, current));

var list = document.getElementById("list");
WEEKS.forEach(function (w, i) {
  var date = fmt.format(new Date(START.getTime() + i * WEEK));
  var li = document.createElement("li");
  if (i < opened) {
    var isNow = (i + 1 === current) && !preview;
    if (isNow) li.className = "now";
    li.innerHTML = "<details" + (isNow ? " open" : "") + "><summary><span class='n'>" + (i + 1) + "</span><span class='t'></span><span class='d'>" + date + "</span></summary><div class='body'>" + w.b + "</div></details>";
    li.querySelector(".t").textContent = w.t;
  } else {
    li.innerHTML = "<div class='row locked'><span class='n'>" + (i + 1) + "</span><span class='t'>Pas encore</span><span class='d'>s’ouvre le " + date + "</span></div>";
  }
  list.appendChild(li);
});

var TRACKS = [
  {q:"Mon premier souvenir musical", t:"La Corrida", a:"Francis Cabrel", c:"J’ai une vision super claire de la Hyundai Terracan de mon père, une voiture qui sentait le cuir neuf, où on demandait tout le temps cette musique."},
  {q:"Celle qui m’a donné envie de faire de la musique", t:"The Climb", a:"Miley Cyrus", c:"J’étais un vrai Disney Channel kid : j’adorais High School Musical, on y jouait dans la cour de récré à 7 ans entre deux matchs de foot, et j’étais fan d’Hannah Montana. Je l’écoute encore aujourd’hui, parce qu’elle parle de résilience et de toujours vouloir aller plus loin : il y aura toujours une montagne à gravir, et ce qu’il faut kiffer, c’est l’ascension."},
  {q:"Mon titre d’adolescence", t:"Superbass", a:"Nicki Minaj", c:"Mdr, je connaissais le morceau par cœur, je me prenais pour Eminem."},
  {q:"Celle qui me fait pleurer (ou presque)", t:"Illicit Affairs", a:"Taylor Swift", c:"J’ai eu un trauma avec un mec (un situationship de 2018 à 2023, mdr), et cette chanson représentait ce que je vivais. C’est probablement une de mes chansons préférées de Taylor Swift.", hm:"Mention spéciale : Closure, Taylor Swift (ouais, je suis un vrai swiftie). J’ai toujours eu du mal à passer à autre chose, je n’arrivais jamais à avoir de closure. Puis un jour tu comprends que tu n’en as pas besoin pour avancer : c’est à moi de décider quand je suis prêt, et je n’ai pas besoin de cette dernière conversation, de ce dernier message, pour tout mettre à plat."},
  {q:"Mon titre antidéprime", t:"Brand New Chanel$", a:"Slayyyter", l:"https://open.spotify.com/track/3FZoov0ORtnr8TznSNI1y2", c:"Super actuel. Beaucoup de white girl music, mais ça marche.", hm:"Mentions spéciales : KGB d’Adela, et Aperture de Harry Styles (le meilleur moment de son concert, je me suis trop marré ce jour-là, donc chaque fois que je l’écoute, ça me remet de bonne humeur)."},
  {q:"Celle que j’écoute seul en voyage", t:"You’re On Your Own, Kid", a:"Taylor Swift", c:"Une chanson qui me parle parce que j’ai été assez seul. Elle parle de la recherche constante de la validation des autres, et du fait qu’on finit par être ok avec l’indépendance : on trouve de la force dans cette solitude."},
  {q:"Celle que j’aurais aimé écrire", t:"American Teenager", a:"Ethel Cain", c:"Elle parle des attentes qu’on place sur les ados américains, et plus largement du rêve qu’on te vend sur ce qu’il faut être pour être le mec cool et populaire, alors que non, ce n’est pas aussi simple. En plus, la production de l’instru est incroyable, je pourrais chialer.", hm:"Mention spéciale : Good Luck, Babe! de Chappell Roan. C’est une histoire où elle dit « good luck » à quelqu’un qui fait semblant d’être hétéro, alors qu’une partie de lui sait la vérité : tu peux te convaincre tant que tu veux, ce sentiment ne partira pas tant que tu n’acceptes pas ta sexualité."},
  {q:"Celle dont l’écriture m’a marqué", t:"Fleeting", a:"Sarah Kinsley", c:"Elle parle du caractère éphémère de toutes les choses, bonnes comme mauvaises. Jsp, ça a changé ma brain chemistry."},
  {q:"Celle que je passerais en soirée", t:"S&M", a:"Rihanna", c:"Mdr, white girl music, gay music : je deviens timbré quand ça passe. Idem avec Confessions nocturnes, Since U Been Gone et What the Hell d’Avril Lavigne."},
  {q:"Celle qui me fait penser à toi", t:"Supercut", a:"Lorde", c:"Je sais que ce qu’on a vécu a été intense, et j’ai donc un montage de toi dans ma tête. La chanson parle d’une relation passée, je m’y retrouve à fond, parce que tout ce qu’on aura pour les prochains mois, ce sont les souvenirs des quelques fois où on s’est vus."}
];

function buildMusic(root) {
  var store = {};
  try { store = JSON.parse(localStorage.getItem("w1") || "{}"); } catch (e) {}
  function persist() { try { localStorage.setItem("w1", JSON.stringify(store)); } catch (e) {} }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  TRACKS.forEach(function (k, i) {
    var art = el("article", "track");
    art.appendChild(el("h3", "", k.q));
    if (k.t) art.appendChild(el("p", "tt", k.t + " · " + k.a));
    art.appendChild(el("p", "", k.c));
    if (k.hm) art.appendChild(el("p", "hm", k.hm));
    if (k.l) { var p = el("p"); var a = el("a", "", "Écouter sur Spotify"); a.href = k.l; a.target = "_blank"; a.rel = "noopener"; p.appendChild(a); art.appendChild(p); }
    if (i === TRACKS.length - 1) {
      var g = el("div", "gallery");
      PHOTOS.forEach(function (p) { var im = document.createElement("img"); im.src = p.s; im.alt = p.a; im.loading = "lazy"; if (p.wide) im.className = "wide"; g.appendChild(im); });
      art.appendChild(g);
    }
    var y = el("div", "yours");
    var lab = el("label", "", "À toi : ta musique pour ça"); lab.htmlFor = "t" + i;
    var ti = el("input"); ti.id = "t" + i; ti.placeholder = "Titre, artiste";
    var tx = el("textarea"); tx.rows = 3; tx.placeholder = "Pourquoi celle-là ?"; tx.setAttribute("aria-label", "Pourquoi celle-là ?");
    var s = store[i] || {}; ti.value = s.t || ""; tx.value = s.w || "";
    function save() { store[i] = {t: ti.value, w: tx.value}; persist(); }
    ti.addEventListener("input", save); tx.addEventListener("input", save);
    y.appendChild(lab); y.appendChild(ti); y.appendChild(tx); art.appendChild(y);
    root.appendChild(art);
  });
  var btn = el("button", "copy", "Copier mes réponses pour Yassir"); btn.type = "button";
  var out = el("p", "copied"); out.setAttribute("role", "status");
  btn.addEventListener("click", function () {
    var lines = [];
    TRACKS.forEach(function (k, i) { var s = store[i]; if (s && (s.t || s.w)) lines.push(k.q + "\n" + (s.t || "") + (s.w ? "\n" + s.w : "")); });
    if (!lines.length) { out.textContent = "Rien à copier pour l’instant."; return; }
    var txt = lines.join("\n\n");
    var done = function () { out.textContent = "C’est copié. Colle-le dans un message pour me l’envoyer."; };
    var fail = function () {
      out.textContent = "Copie ce texte et envoie-le-moi :";
      var fb = el("textarea"); fb.readOnly = true; fb.rows = 8; fb.value = txt; out.appendChild(fb); fb.select();
    };
    try { navigator.clipboard.writeText(txt).then(done, fail); } catch (e) { fail(); }
  });
  root.appendChild(btn); root.appendChild(out);
  root.appendChild(el("p", "copied", "Rien n’est envoyé automatiquement : tes réponses restent sur ton appareil."));
}
var w1 = document.getElementById("w1");
if (w1) buildMusic(w1);

var st = document.getElementById("status");
if (!preview && now < START) {
  st.textContent = "Ça commence le " + fmt.format(START) + ".";
} else if (opened >= WEEKS.length) {
  st.textContent = "Les douze semaines sont ouvertes.";
} else {
  var next = fmt.format(new Date(START.getTime() + opened * WEEK));
  st.textContent = "Semaine " + opened + " sur " + WEEKS.length + ". Prochaine page le " + next + ".";
}
</script>
